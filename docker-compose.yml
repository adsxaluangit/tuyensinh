version: '3.8'
services:
  db:
    image: postgres:18-alpine
    container_name: tuyensinh-db
    environment:
      POSTGRES_USER: tuyensinh
      POSTGRES_PASSWORD: tuyensinh_password
      POSTGRES_DB: tuyensinh_db
    volumes:
      - tuyensinh-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    command: postgres -c max_wal_size=2GB -c min_wal_size=1GB
    networks:
      - tuyensinh-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuyensinh-backend
    restart: always
    environment:
      PORT: 1338
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: tuyensinh_db
      DATABASE_USERNAME: tuyensinh
      DATABASE_PASSWORD: tuyensinh_password
      HOST: 0.0.0.0
      APP_KEYS: "key1,key2,key3,key4"
      API_TOKEN_SALT: "salt123"
      ADMIN_JWT_SECRET: "adminjwt123"
      TRANSFER_TOKEN_SALT: "transfer123"
      JWT_SECRET: "jwt123"
      NODE_ENV: production
      STRAPI_TELEMETRY_DISABLED: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      SMTP_HOST: mail.mic1.edu.vn
      SMTP_PORT: 587
      SMTP_USERNAME: bantuyensinh@mic1.edu.vn
      SMTP_PASSWORD: Ts123456a@
      SMTP_FROM: bantuyensinh@mic1.edu.vn
      SMTP_FROM_NAME: "Ban tuyển sinh"
      PUBLIC_URL: http://tuyensinh1.mic1.edu.vn:82
    ports:
      - "1338:1338"
    depends_on:
      - db
    networks:
      - tuyensinh-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1338/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend-uploads:/opt/app/public/uploads

  frontend:
    build:
      context: ./fontend
      dockerfile: Dockerfile
      args:
        - VITE_STRAPI_URL=http://tuyensinh1.mic1.edu.vn:1338
    container_name: tuyensinh-frontend
    restart: unless-stopped
    ports:
      - "82:82"
    networks:
      - tuyensinh-net
    depends_on:
      - backend

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: tuyensinh-backup
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: tuyensinh
      POSTGRES_PASSWORD: tuyensinh_password
      POSTGRES_DB: tuyensinh_db
    volumes:
      - backup-data:/backups
    depends_on:
      - db
    networks:
      - tuyensinh-net

volumes:
  tuyensinh-data:
  backend-uploads:
  backup-data:


networks:
  tuyensinh-net:
